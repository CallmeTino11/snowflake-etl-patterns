# Local demo only. Change the secret key and admin password before any real use.
services:
  superset:
    build: .
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "change-me-before-use"
    volumes:
      - superset_home:/app/superset_home
    command: >
      bash -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User
      --email admin@example.com --password admin &&
      superset init &&
      /usr/bin/run-server.sh"
volumes:
  superset_home:
